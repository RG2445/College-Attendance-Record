<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>
  <div class="dashboard-container">
    <div class="sidebar">
      <h2>Dashboard</h2>
      <ul>
        <li><a href="#" onclick="showTeacherDashboard()">Teacher Panel</a></li>
        <li><a href="#" onclick="showStudentDashboard()">Student Panel</a></li>
      </ul>
    </div>
    <div class="main-content">
      <div class="top-nav">
        <div class="profile">
          <img src="images/Screenshot 2025-04-11 235933.png" alt="Profile" width="40" />
        </div>
      </div>

      <!-- Teacher Panel -->
      <div id="teacher-panel" class="panel">
        <h3>Mark Attendance</h3>
        <form id="attendance-form">
          <input type="text" id="student-name" placeholder="Student Name" required />
          <select id="attendance-status" required>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
          </select>
          <button type="submit">Mark Attendance</button>
        </form>
        <div class="marked-list" id="marked-attendance">
          <h4>Marked Attendance:</h4>
        </div>
      </div>

      <!-- Student Panel -->
      <div id="student-panel" class="panel hidden">
        <h3>Your Attendance</h3>
        <div class="attendance-stats">
          <p>Total Classes: <span id="total-classes">0</span></p>
          <p>Present: <span id="present-count">0</span></p>
          <p>Attendance Percentage: <span id="attendance-percentage">0%</span></p>
        </div>
      </div>
    </div>
  </div>
  <script src="script2.js"></script>
</body>
</html>
